<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>🔔</title>
<style>
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:sans-serif;margin:0}
.card{background:white;border-radius:20px;padding:40px;text-align:center;max-width:350px}
.campana{font-size:80px;animation:ring 0.5s ease-in-out 3;display:inline-block}
@keyframes ring{0%{transform:rotate(0)}25%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}75%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.msg{background:#f0f0f0;padding:12px;border-radius:10px;margin:15px 0}
.barra{height:3px;background:#ddd;margin-top:15px}
.fill{height:100%;background:#667eea;width:100%;animation:cierra 2s linear forwards}
@keyframes cierra{from{width:100%}to{width:0}}
</style>
</head>
<body>
<div class="card">
    <div class="campana">🔔</div>
    <h3>¡Nueva nota!</h3>
    <div class="msg" id="msg"></div>
    <div class="barra"><div class="fill"></div></div>
</div>
<script>
    const m = new URLSearchParams(location.search).get('m');
    if(m) document.getElementById('msg').innerHTML = m.replace(/\n/g,'<br>');
    try {
        const a = new (AudioContext||webkitAudioContext)();
        const o = a.createOscillator();
        const g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.frequency.value=880; g.gain.value=0.2;
        o.start();
        setTimeout(()=>{g.gain.exponentialRampToValueAtTime(0.00001,a.currentTime+0.2);o.stop()},200);
        a.resume();
    } catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    setTimeout(()=>window.close(),2000);
</script>
</body>
</html>
